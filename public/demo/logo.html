<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Logo marks</title><meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#0b0e14;color:#cdd5de;font-family:Space Grotesk,sans-serif;padding:40px}
 h1{font-size:18px;font-weight:600;margin-bottom:24px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
 .cell{background:#11151c;border:1px solid #1f2630;border-radius:16px;padding:22px;text-align:center}
 .cell svg{width:84px;height:84px}
 .lbl{margin-top:12px;font-size:12px;color:#8a94a1}
 .lbl b{color:#fff;font-size:14px}
</style></head><body>
<h1>Logo marks — pick a letter (molten orange + graphite)</h1>
<div class="grid" id="g"></div>
<script>
const D=`<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b313a"/><stop offset="1" stop-color="#14171c"/></linearGradient>
<linearGradient id="mo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9d3c"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>`;
const S=(inner)=>`<svg viewBox="0 0 100 100"><defs>${D}</defs>${inner}</svg>`;
const tile=`<rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gr)"/>`;
const R=(size,fill,x=50)=>`<text x="${x}" y="54" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="${size}" fill="${fill}">R</text>`;

const marks={
 A:S(`${tile}${R(56,'#f4f6f8')}<rect x="48.5" y="16" width="3" height="68" rx="1.5" fill="url(#mo)"/>`),
 B:S(`${tile}<rect x="47" y="10" width="6" height="20" rx="3" fill="url(#mo)"/><path d="M50 30 C66 30 76 42 76 58 C76 74 64 84 50 84 C36 84 24 74 24 58 C24 42 34 30 50 30 Z" fill="none" stroke="url(#mo)" stroke-width="7"/><circle cx="50" cy="58" r="9" fill="url(#mo)"/>`),
 C:S(`${tile}<circle cx="30" cy="70" r="6" fill="#ff8a2a"/><circle cx="46" cy="74" r="5" fill="#ff7a18"/><circle cx="62" cy="70" r="6" fill="#ff8a2a"/><path d="M28 52 L50 26 L72 52 L62 52 L50 38 L38 52 Z" fill="url(#mo)"/>`),
 D:S(`<defs><mask id="cut"><rect x="6" y="6" width="88" height="88" rx="26" fill="#fff"/><text x="50" y="55" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="58" fill="#000">R</text></mask></defs><rect x="6" y="6" width="88" height="88" rx="26" fill="url(#mo)"/><rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gr)" mask="url(#cut)"/>`),
 /* E — two mould halves offset, forming R via a vertical split with gap */
 E:S(`${tile}<g><clipPath id="lh"><rect x="0" y="0" width="49" height="100"/></clipPath><clipPath id="rh"><rect x="51" y="0" width="49" height="100"/></clipPath>${R(56,'#e7ebf0').replace('<text','<text clip-path="url(#lh)"')}${R(56,'#aeb6c0').replace('<text','<text clip-path="url(#rh)"')}</g><rect x="48" y="20" width="4" height="60" fill="url(#mo)"/>`),
 /* F — molten flow R: R in molten gradient on graphite */
 F:S(`${tile}${R(58,'url(#mo)')}`),
 /* G — R as moulded part with sprue tab top */
 G:S(`${tile}<rect x="47" y="8" width="6" height="14" rx="3" fill="url(#mo)"/>${R(54,'#f4f6f8')}`),
 /* H — hexagon tile + molten R */
 H:S(`<polygon points="50,5 89,27 89,73 50,95 11,73 11,27" fill="url(#gr)"/>${R(50,'url(#mo)')}`),
 /* I — RI monogram split by seam */
 I:S(`${tile}<text x="50" y="55" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="38" letter-spacing="-2" fill="#f4f6f8">RI</text><rect x="48.5" y="22" width="3" height="56" rx="1.5" fill="url(#mo)" opacity=".9"/>`),
 /* J — cavity dot: minimalist R with a molten gate dot */
 J:S(`${tile}${R(56,'#f4f6f8')}<circle cx="72" cy="30" r="6" fill="url(#mo)"/>`),
 /* K — open mould: two brackets [ ] around molten core */
 K:S(`${tile}<path d="M40 28 H30 a4 4 0 0 0 -4 4 v36 a4 4 0 0 0 4 4 h10" fill="none" stroke="#cdd5de" stroke-width="6" stroke-linecap="round"/><path d="M60 28 H70 a4 4 0 0 1 4 4 v36 a4 4 0 0 1 -4 4 H60" fill="none" stroke="#cdd5de" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="11" fill="url(#mo)"/>`),
 /* L — chevron stack (layers/precision) in molten */
 L:S(`${tile}<path d="M28 40 L50 28 L72 40" fill="none" stroke="url(#mo)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 56 L50 44 L72 56" fill="none" stroke="#9aa0a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 72 L50 60 L72 72" fill="none" stroke="#5b6573" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`),
};
const names={A:"Mould seam R",B:"Injection gate",C:"Pellets→part",D:"Cavity R (negative)",E:"Two mould halves",F:"Molten R",G:"R with sprue",H:"Hexagon molten R",I:"RI seam monogram",J:"R + gate dot",K:"Open mould [ ]",L:"Layer chevrons"};
document.getElementById('g').innerHTML=Object.keys(marks).map(k=>`<div class="cell">${marks[k]}<div class="lbl"><b>${k}</b> · ${names[k]}</div></div>`).join('');
</script>
</body></html>
